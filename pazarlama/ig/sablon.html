<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<base href="../../">
<title>MemoryQR Instagram şablonları</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="kart.css">
<script src="vendor/qrcode.js"></script>
<style>
/* Instagram görsel şablonları: araclar/ig-uret.cjs her slaydı burada çizip ekran görüntüsünü alır */
:root{--bordo:#8c2f52;--bordo2:#6d2340;--krem:#f7efe9;--altin:#c9a04f;--ink:#1d1820;--muted:#6b6070;
  --disp:"Barlow Condensed","Barlow",sans-serif;--body:"Barlow",sans-serif;--serif:"Playfair Display",serif;--script:"Great Vibes",cursive}
*{box-sizing:border-box}
body{margin:0;background:#888;font-family:var(--body)}
.ab{position:relative;width:1080px;height:1350px;overflow:hidden;color:var(--ink);background:var(--krem);display:flex;flex-direction:column}
.ab.d{height:1920px}
.pad{padding:96px 84px;display:flex;flex-direction:column;gap:28px;flex:1;min-height:0}
.ust{font:600 30px var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--bordo)}
.bas{font:700 150px/0.95 var(--disp);margin:0;text-wrap:balance}
.d .bas{font-size:164px}
.alt{font:400 46px/1.35 var(--body);color:var(--muted);margin:0;text-wrap:balance}
.frame{position:absolute;inset:34px;border:2px solid rgba(201,160,79,.55);border-radius:30px;pointer-events:none}
.t-bordo .frame,.t-koyu .frame{border-color:rgba(243,217,160,.4)}
.peek{position:absolute;right:-60px;bottom:110px;width:430px;transform:rotate(-9deg);border-radius:8px;box-shadow:0 30px 70px rgba(30,10,20,.35)}
.d .peek{width:560px;bottom:260px}
.bignum{position:absolute;right:50px;top:30px;font:700 760px/1 var(--disp);color:var(--bordo);opacity:.07}
.foot{position:absolute;left:84px;right:84px;bottom:54px;display:flex;justify-content:space-between;align-items:center;font:600 26px var(--body);letter-spacing:.06em;color:var(--muted)}
.d .foot{bottom:120px}
.foot b{letter-spacing:.2em}
.t-bordo{background:linear-gradient(160deg,#9a3a5d,#6d2340);color:#fff}.t-bordo .ust{color:#f3d9a0}.t-bordo .alt{color:#f4dfe7}.t-bordo .foot{color:#f4dfe7}
.t-koyu{background:#1d1820;color:#fff}.t-koyu .ust{color:var(--altin)}.t-koyu .alt{color:#cfc3d2}.t-koyu .foot{color:#a99eac}
.t-foto{color:#fff}.t-foto .ust{color:#f3d9a0}.t-foto .alt{color:#f4ece8}.t-foto .foot{color:#f4ece8}
.bg{position:absolute;inset:0;background:center/cover no-repeat}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,10,15,.15) 0%,rgba(20,10,15,.25) 40%,rgba(20,10,15,.82) 100%)}
.bottom{margin-top:auto}
.center{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.center img{max-width:100%;max-height:100%;border-radius:22px;box-shadow:0 30px 70px rgba(60,20,30,.25)}
.center img.card{border-radius:6px}
.phone{position:relative;height:100%;max-height:1180px;aspect-ratio:390/844;background:#151317;border-radius:72px;padding:20px;box-shadow:0 40px 90px rgba(40,10,25,.35)}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:54px;box-shadow:none}
.phone::after{content:"";position:absolute;top:34px;left:50%;transform:translateX(-50%);width:150px;height:40px;border-radius:20px;background:#151317}
.num{width:120px;height:120px;border-radius:50%;background:var(--bordo);color:#fff;display:grid;place-items:center;font:700 64px var(--disp)}
.items{display:grid;gap:30px;margin-top:20px}
.items div{display:flex;gap:30px;align-items:center;font:600 54px/1.15 var(--body);background:#fff;border-radius:22px;padding:28px 34px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.items span{font-size:60px;flex:none}
.price{font:700 170px/1 var(--disp);color:var(--bordo)}
.plist{display:grid;gap:14px;font:500 42px/1.3 var(--body);padding:0;margin:0;list-style:none}
.plist li::before{content:"✓  ";color:var(--bordo);font-weight:700}
.pimg{height:470px;border-radius:26px;background:center/cover no-repeat;box-shadow:0 20px 50px rgba(60,20,30,.18)}
.q{font:700 124px/0.98 var(--disp);margin:0;text-wrap:balance}
.a{font:400 58px/1.4 var(--body);color:var(--ink);margin:0;text-wrap:balance}
.badge{align-self:flex-start;font:700 40px var(--body);background:var(--bordo);color:#fff;border-radius:999px;padding:12px 34px}
.logo{width:150px;height:150px}
.pill{align-self:flex-start;background:#fff;color:var(--bordo);font:700 40px var(--body);border-radius:999px;padding:22px 40px}
.box{flex:1;border-radius:40px;background:rgba(255,255,255,.12);margin:20px 0}
.grid4{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:30px;align-content:center;justify-items:center}
.grid4 img{width:100%;border-radius:6px;box-shadow:0 20px 40px rgba(60,20,30,.2)}
.scan{position:absolute;left:50%;top:44%;width:560px;height:560px;transform:translate(-50%,-50%)}
.scan i{position:absolute;width:120px;height:120px;border:10px solid #fff;border-radius:18px}
.scan i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.scan i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.scan i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.scan i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.qrpill{position:absolute;left:50%;top:70%;transform:translateX(-50%);background:#ffd60a;color:#1b1b1b;font:600 42px var(--body);padding:22px 40px;border-radius:999px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.chat{flex:1;display:flex;flex-direction:column;justify-content:center;gap:34px}
.chat div{align-self:flex-start;max-width:86%;background:#fff;color:#111;font:500 52px/1.3 var(--body);padding:30px 38px;border-radius:12px 40px 40px 40px;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.chat div:nth-child(even){align-self:flex-end;background:#dcf8c6;border-radius:40px 12px 40px 40px}
.wa{background:#0b141a;background-image:radial-gradient(rgba(255,255,255,.04) 2px,transparent 2px);background-size:36px 36px;color:#fff}
.tek{flex:1;display:flex;align-items:center;justify-content:center}
.tek img{height:84%;border-radius:8px;box-shadow:0 40px 90px rgba(60,20,30,.3)}
.tnum{position:absolute;top:110px;right:90px;font:700 90px var(--disp);color:var(--bordo);opacity:.9}

/* ---- marka seti (m-*): açık pembe zemin, yumuşak daireler, iki renkli başlık, beyaz kartlar, altta koyu bant */
.m{background:#f8eef1;--mb:#8c2f52;--md:#5a1c36;--mi:#2a1520}
.m .circ{position:absolute;border-radius:50%;background:rgba(140,47,82,.06)}
.m .mpad{position:relative;flex:1;display:flex;flex-direction:column;gap:34px;padding:92px 76px 60px;min-height:0}
.d.m .mpad{padding-top:200px;padding-bottom:120px;gap:44px}
.m .tag{align-self:flex-start;background:rgba(140,47,82,.1);color:var(--mb);font:700 28px var(--body);letter-spacing:.14em;text-transform:uppercase;padding:14px 28px;border-radius:999px}
.m .mh{font:700 100px/1.02 var(--body);letter-spacing:-.025em;margin:0;color:var(--mi);text-wrap:balance}
.m .mh em{font-style:normal;color:var(--mb)}
.m .mt{font:400 40px/1.45 var(--body);color:#6d5a63;margin:0;max-width:880px;text-wrap:pretty}
.m .mt b{color:var(--mi);font-weight:700}
.m .brand{display:flex;align-items:center;gap:22px;font:700 64px var(--body);letter-spacing:-.02em;color:var(--mi)}
.m .tile{width:104px;height:104px;border-radius:28px;background:var(--mb);display:grid;place-items:center;flex:none}
.m .tile svg{width:66px;height:66px;color:#fff}
.m .chips{display:flex;flex-wrap:wrap;gap:18px}
.m .chips span{background:#fff;border-radius:999px;padding:18px 30px;font:600 34px var(--body);color:var(--mi);box-shadow:0 8px 22px rgba(90,28,54,.08)}
.m .swipe{font:700 34px var(--body);color:var(--mb);margin-top:auto}
.m .band{position:relative;height:150px;flex:none;background:var(--md);display:flex;align-items:center;gap:24px;padding:0 60px;color:#fff}
.m .band .tile{width:76px;height:76px;border-radius:20px;background:#fff}
.m .band .tile svg{width:48px;height:48px;color:var(--mb)}
.m .band p{margin:0;font:700 32px/1.2 var(--body);flex:1}
.m .band span{font:600 32px var(--body);color:#f2bfd2}
.m .steps{display:grid;gap:22px}
.m .step,.m .feat{display:flex;gap:26px;align-items:center;background:#fff;border-radius:40px;padding:26px 32px;box-shadow:0 10px 28px rgba(90,28,54,.08)}
.m .step i{width:76px;height:76px;border-radius:50%;background:var(--mb);color:#fff;display:grid;place-items:center;font:700 38px var(--body);font-style:normal;flex:none}
.m .step b,.m .feat b{display:block;font:700 36px/1.2 var(--body);color:var(--mi)}
.m .step small,.m .feat small{display:block;font:400 29px/1.35 var(--body);color:#6d5a63;margin-top:4px}
.m .feat i{width:96px;height:96px;border-radius:50%;background:var(--mb);display:grid;place-items:center;flex:none}
.m .feat i svg{width:48px;height:48px;color:#fff}
.m .feats{display:grid;gap:24px;margin-top:10px}
.m .mphone{position:absolute;right:-70px;bottom:190px;width:470px;aspect-ratio:390/844;background:#151317;border-radius:70px;padding:16px;box-shadow:0 40px 90px rgba(40,10,25,.3);transform:rotate(3deg)}
.d.m .mphone{bottom:420px;width:520px}
.m .mphone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:56px}
.m .vs{display:grid;grid-template-columns:1fr 1fr;gap:24px;flex:1;min-height:0;align-content:start}
.m .vs>div{border-radius:40px;padding:34px 30px;display:flex;flex-direction:column;gap:20px}
.m .vs h3{margin:0;font:700 40px var(--body)}
.m .vs ul{margin:0;padding:0;list-style:none;display:grid;gap:18px;font:500 31px/1.35 var(--body)}
.m .vs .eski{background:#ece2e6;color:#6d5a63}.m .vs .eski li::before{content:"✕  ";color:#b07a8e;font-weight:700}
.m .vs .yeni{background:var(--mb);color:#fff}.m .vs .yeni li::before{content:"✓  ";color:#f6c9da;font-weight:700}
.m .pk{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.m .pk>div{background:#fff;border-radius:36px;padding:30px;box-shadow:0 10px 28px rgba(90,28,54,.08);display:flex;flex-direction:column;gap:8px}
.m .pk>div.on{background:var(--mb);color:#fff}
.m .pk b{font:700 32px var(--body)}.m .pk strong{font:700 64px/1 var(--body);letter-spacing:-.02em;color:var(--mb)}.m .pk .on strong{color:#fff}
.m .pk small{font:400 26px/1.35 var(--body);color:#6d5a63}.m .pk .on small{color:#f6dbe5}
.m .kgrid{flex:1;display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(0,1fr);gap:26px;justify-items:center;align-items:center;min-height:0}
.m .kgrid img{height:100%;max-width:100%;object-fit:contain;border-radius:8px;box-shadow:0 20px 44px rgba(60,20,30,.18)}
.m .qbig{font:700 92px/1.05 var(--body);letter-spacing:-.02em;color:var(--mi);margin:0;text-wrap:balance}
.m .abox{background:#fff;border-radius:40px;padding:40px 44px;font:400 42px/1.45 var(--body);color:var(--mi);box-shadow:0 10px 28px rgba(90,28,54,.08)}
.m .mfoto{flex:1;min-height:0;border-radius:40px;background:center/cover no-repeat;box-shadow:0 20px 50px rgba(60,20,30,.18)}
.m.cta{background:var(--md);color:#fff}.m.cta .circ{background:rgba(255,255,255,.05)}
.m.cta .mh{color:#fff}.m.cta .mh em{color:#f2bfd2}.m.cta .mt{color:#f2d6e0}
.m.cta .bigtile{width:230px;height:230px;border-radius:60px;background:#fff;display:grid;place-items:center;box-shadow:0 30px 60px rgba(0,0,0,.25)}
.m.cta .bigtile svg{width:150px;height:150px;color:var(--mb)}
.m .btns{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.m .btns span{background:#120a0e;color:#fff;border-radius:26px;padding:24px 36px;font:700 36px var(--body);display:flex;gap:16px;align-items:center}
.m .btns span.l{background:#fff;color:var(--md)}
</style>
</head>
<body>
<div id="stage"></div>
<script>
"use strict";
// kart.js'in beklediği site yardımcıları
const SITE_URL = "https://memoryqr.bulqr.com.tr/";
const guestLink = code => `${SITE_URL}?e=${encodeURIComponent(code)}`;
const KINDS = {dugun: "Düğün", nisan: "Nişan", kina: "Kına", soz: "Söz", mezuniyet: "Mezuniyet", dogum_gunu: "Doğum günü", diger: "Etkinlik"};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const slug = s => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-");
const $ = (s, el = document) => el.querySelector(s);
const toast = () => {};
const fmtDate = d => new Date(String(d) + "T12:00:00").toLocaleDateString("tr-TR", {day: "numeric", month: "long", year: "numeric"});
function loadScript(src) { return new Promise((res, rej) => { if ([...document.scripts].some(s => s.src.endsWith(src))) return res(); const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = rej; document.head.append(el); }); }

const LOGO = `<svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M17.5 14.5c1.6-1.6 4 .7 2.4 2.4l-2.4 2.6-2.4-2.6c-1.6-1.7.8-4 2.4-2.4z" fill="currentColor" stroke="none"/></svg>`;
const FOOT = `<div class="foot"><b style="letter-spacing:.04em">@memoryqrtr</b><span>memoryqr.bulqr.com.tr</span></div>`;
const foto = n => `kart/foto/${n}.webp`;
const ekran = n => `pazarlama/ig/ekran/${n}.png`;
const evOf = s => ({code: "ORNEK1", title: "Seda & Yusuf", kind: "dugun", event_date: "2026-06-14", ...(s.ev || {})});

async function cardImg(s, w, h) {
  await loadScript("kart.js");
  await designReady(s.tasarim || "bordo");
  const sel = {design: s.tasarim || "bordo", text: ""};
  const cv = !s.urun || s.urun === "kart" ? drawCard(evOf(s), sel.design, "", 8) : mockup(s.urun, evOf(s), sel, w, h);
  return cv.toDataURL("image/jpeg", .92);
}


// ---- marka seti yardımcıları
const ICON = {
  foto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>',
  video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 10l5-3v10l-5-3z"/></svg>',
  indir: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  kilit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  qr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM18 18h3v3h-3z" fill="currentColor" stroke="none"/></svg>',
  palet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-1.2-1-1.6-1-2.8 0-1 .8-1.7 1.8-1.7H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10.5" cy="7.5" r="1.2" fill="currentColor"/><circle cx="15" cy="7.5" r="1.2" fill="currentColor"/></svg>',
  kalp: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
  yildiz: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg>',
  saat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  kisi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.2a5 5 0 0 1 5.5 4.8"/></svg>',
  goz: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  hediye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 9v12M3 13h18M12 9C10 5 6.5 5.5 7.5 8 8 9 12 9 12 9zm0 0c2-4 5.5-3.5 4.5-1-.5 1-4.5 1-4.5 1z"/></svg>',
};
const MARK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.4"/><rect x="14" y="3.5" width="6.5" height="6.5" rx="1.4"/><rect x="3.5" y="14" width="6.5" height="6.5" rx="1.4"/><path d="M17.2 14.4c1.5-1.5 3.8.7 2.3 2.3l-2.3 2.4-2.3-2.4c-1.5-1.6.8-3.8 2.3-2.3z" fill="currentColor" stroke="none"/></svg>`;
const md = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const head = s => `<h1 class="mh" style="${s.hs ? `font-size:${s.hs}px` : ""}">${(s.b || []).map((x, i) => i % 2 ? `<em>${esc(x)}</em>` : esc(x)).join("<br>")}</h1>`;
const circles = (seed = 0) => [[-180, -160, 620], [640, 820, 700], [700, -220, 420]].map(([x, y, r], i) =>
  `<div class="circ" style="left:${x + seed * 60 * (i - 1)}px;top:${y}px;width:${r}px;height:${r}px"></div>`).join("");
const band = s => s.bant === false ? "" : `<div class="band"><div class="tile">${MARK}</div><p>${esc(s.bant || "Misafirlerin çektiği her an, tek albümde.").replace(" | ", "<br>")}</p><span>@memoryqrtr</span></div>`;

async function renderM(el, s, d) {
  const t = s.tpl;
  el.classList.add("m");
  if (t === "m-kapak") {
    el.innerHTML = `${circles(1)}<div class="mpad"><div class="brand"><div class="tile">${MARK}</div>MemoryQR</div>
      <div style="margin-top:${d ? 120 : 40}px">${head({...s, hs: s.hs || (d ? 150 : 132)})}</div>
      ${s.metin ? `<p class="mt">${md(s.metin)}</p>` : ""}
      ${s.chips ? `<div class="chips">${s.chips.map(c => `<span>${esc(c)}</span>`).join("")}</div>` : ""}
      <svg style="position:absolute;right:96px;bottom:${d ? 330 : 240}px;width:150px;height:150px;color:rgba(140,47,82,.35)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
      ${s.kaydir !== false ? `<div class="swipe">${esc(s.kaydir || "Kaydır, tanıyalım")}  ⟶</div>` : ""}</div>${band(s)}`;
  } else if (t === "m-adim") {
    el.innerHTML = `${circles(2)}<div class="mpad"><div class="tag">${esc(s.etiket)}</div>${head({...s, hs: s.hs || 92})}
      <p class="mt" style="max-width:${s.ekran ? 520 : 880}px">${md(s.metin)}</p>
      <div class="steps" style="margin-top:auto;max-width:${s.ekran ? 600 : 920}px">${s.adimlar.map(([b, k], i) => `<div class="step"><i>${i + 1}</i><div><b>${esc(b)}</b><small>${esc(k)}</small></div></div>`).join("")}</div></div>
      ${s.ekran ? `<div class="mphone"><img src="${ekran(s.ekran)}"></div>` : ""}${band(s)}`;
  } else if (t === "m-liste") {
    el.innerHTML = `${circles(3)}<div class="mpad"><div class="tag">${esc(s.etiket)}</div>${head({...s, hs: s.hs || 92})}
      <div class="feats" style="margin-top:${d ? 60 : "auto"};margin-bottom:${d ? "auto" : 0}">${s.maddeler.map(([ic, b, k]) => `<div class="feat"><i>${ICON[ic] || ICON.yildiz}</i><div><b>${esc(b)}</b><small>${esc(k)}</small></div></div>`).join("")}</div></div>${band(s)}`;
  } else if (t === "m-karsi") {
    el.innerHTML = `${circles(1)}<div class="mpad"><div class="tag">${esc(s.etiket)}</div>${head({...s, hs: s.hs || 88})}
      <div class="vs" style="margin-top:20px"><div class="eski"><h3>${esc(s.sol[0])}</h3><ul>${s.sol[1].map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
      <div class="yeni"><h3>${esc(s.sag[0])}</h3><ul>${s.sag[1].map(x => `<li>${esc(x)}</li>`).join("")}</ul></div></div></div>${band(s)}`;
  } else if (t === "m-paket") {
    el.innerHTML = `${circles(2)}<div class="mpad"><div class="tag">${esc(s.etiket)}</div>${head({...s, hs: s.hs || 88})}
      <div class="pk" style="margin-top:auto">${s.paketler.map(([a, f, k, on]) => `<div class="${on ? "on" : ""}"><b>${esc(a)}</b><strong>${esc(f)}</strong><small>${esc(k)}</small></div>`).join("")}</div>
      ${s.metin ? `<p class="mt" style="font-size:30px">${md(s.metin)}</p>` : ""}</div>${band(s)}`;
  } else if (t === "m-kartlar") {
    await loadScript("kart.js");
    const imgs = [];
    for (const id of s.tasarimlar) { await designReady(id); imgs.push(drawCard(evOf(s), id, "", 4).toDataURL("image/jpeg", .9)); }
    el.innerHTML = `${circles(3)}<div class="mpad"><div class="tag">${esc(s.etiket)}</div>${head({...s, hs: s.hs || 84})}
      <div class="kgrid">${imgs.map(u => `<img src="${u}">`).join("")}</div></div>${band(s)}`;
  } else if (t === "m-foto") {
    const src = s.foto ? foto(s.foto) : await cardImg(s, 1000, 760);
    el.innerHTML = `${circles(2)}<div class="mpad"><div class="tag">${esc(s.etiket)}</div>${head({...s, hs: s.hs || 88})}
      ${s.metin ? `<p class="mt">${md(s.metin)}</p>` : ""}<div class="mfoto" style="background-image:url(${src})"></div></div>${band(s)}`;
  } else if (t === "m-soru") {
    el.innerHTML = `${circles(1)}<div style="position:absolute;right:40px;top:${d ? 160 : 40}px;font:700 620px/1 var(--body);color:rgba(140,47,82,.07)">?</div><div class="mpad" style="justify-content:center"><div class="tag">${esc(s.etiket || "Sık sorulan")}</div>
      <h1 class="qbig">${esc(s.soru)}</h1><div class="abox">${md(s.cevap)}</div></div>${band(s)}`;
  } else if (t === "m-cta") {
    el.classList.add("cta");
    el.innerHTML = `${circles(2)}<div class="mpad" style="align-items:center;text-align:center;justify-content:center;gap:${d ? 50 : 34}px">
      <div class="bigtile">${MARK}</div><div style="font:700 92px var(--body);letter-spacing:-.02em">MemoryQR</div>
      <p class="mt" style="color:#f2bfd2;font-weight:600">${esc(s.ust || "Düğün · Nişan · Kına · Doğum günü · Mezuniyet")}</p>
      ${head({...s, hs: s.hs || 96})}
      <div class="btns">${(s.butonlar || ["Tasarımını seç", "Siparişi başlat"]).map((b, i) => `<span class="${i ? "" : "l"}">${esc(b)}</span>`).join("")}</div>
      <p class="mt" style="font-size:34px">${esc(s.alt || "memoryqr.bulqr.com.tr · WhatsApp 0531 677 59 97")}</p>
      <p class="mt" style="font:700 40px var(--body);color:#f2bfd2">@memoryqrtr</p></div>`;
  }
}

// spec → .ab öğesi (d: dikey 1080×1920)
async function render(s, d) {
  const el = document.createElement("div");
  el.className = "ab" + (d ? " d" : "");
  const t = s.tpl;
  if (t.startsWith("m-")) await renderM(el, s, d);
  else if (t === "kapak") {
    el.classList.add("t-" + (s.tema || "krem"));
    const peek = s.tema !== "foto" ? `<div class="frame"></div><img class="peek card" src="${await cardImg({tasarim: s.tasarim || (s.tema === "krem" ? "bordo" : "cicek")}, 0, 0)}">` : "";
    el.innerHTML = `${s.tema === "foto" ? `<div class="bg" style="background-image:url(${foto(s.foto)})"></div><div class="shade"></div>` : peek}
      <div class="pad" style="position:relative">${s.ust ? `<div class="ust">${esc(s.ust)}</div>` : ""}
        <div class="${s.tema === "foto" ? "bottom" : "center"}" style="flex-direction:column;align-items:flex-start;justify-content:center;gap:34px;${s.tema === "foto" ? "margin-bottom:90px" : `padding-bottom:${d ? 900 : 330}px;max-width:${d ? 900 : 610}px`}">
          <h1 class="bas" style="${s.baslik.length > 30 && s.tema !== "foto" ? `font-size:${d ? 132 : 112}px` : ""}">${esc(s.baslik)}</h1>${s.alt ? `<p class="alt">${esc(s.alt)}</p>` : ""}</div></div>${FOOT}`;
  } else if (t === "foto") {
    el.classList.add("t-foto");
    el.innerHTML = `<div class="bg" style="background-image:url(${foto(s.foto)})"></div><div class="shade"></div>
      <div class="pad" style="position:relative"><div class="bottom" style="display:grid;gap:20px;margin-bottom:90px"><h1 class="bas">${esc(s.baslik)}</h1>${s.alt ? `<p class="alt">${esc(s.alt)}</p>` : ""}</div></div>${FOOT}`;
  } else if (t === "urun" || t === "tekkart") {
    const card = !s.urun || s.urun === "kart" || t === "tekkart";
    const src = await cardImg(t === "tekkart" ? {...s, urun: "kart"} : s, 1000, 760);
    el.innerHTML = `<div class="frame"></div><div class="pad">${s.baslik ? `<h1 class="bas" style="font-size:${d ? 124 : 108}px">${esc(s.baslik)}</h1>` : ""}
      <div class="${t === "tekkart" ? "tek" : "center"}"><img class="${card ? "card" : ""}" src="${src}" style="${card ? `height:${d ? 1250 : 820}px` : "width:100%"}"></div>
      ${s.alt ? `<p class="alt">${esc(s.alt)}</p>` : ""}</div>${s.no ? `<div class="tnum">${String(s.no).padStart(2, "0")}</div>` : ""}${FOOT}`;
  } else if (t === "kartlar") {
    await loadScript("kart.js");
    const imgs = [];
    for (const id of s.tasarimlar) { await designReady(id); imgs.push(drawCard(evOf(s), id, "", 4).toDataURL("image/jpeg", .9)); }
    el.innerHTML = `<div class="pad"><h1 class="bas">${esc(s.baslik)}</h1><div class="grid4">${imgs.map(u => `<img src="${u}">`).join("")}</div></div>${FOOT}`;
  } else if (t === "ekran") {
    el.innerHTML = `<div class="frame"></div><div class="pad"><h1 class="bas" style="font-size:${d ? 124 : 104}px">${esc(s.baslik)}</h1>
      <div class="center"><div class="phone"><img src="${ekran(s.ekran)}"></div></div>${s.alt ? `<p class="alt">${esc(s.alt)}</p>` : ""}</div>${FOOT}`;
  } else if (t === "adim") {
    const vis = s.ekran ? `<div class="phone"><img src="${ekran(s.ekran)}"></div>` : `<img src="${await cardImg(s, 1000, 760)}" style="width:100%">`;
    el.innerHTML = `<div class="pad"><div style="display:flex;gap:36px;align-items:center"><div class="num">${s.no}</div><h1 class="bas" style="font-size:100px">${esc(s.baslik)}</h1></div>
      <p class="alt">${esc(s.alt)}</p><div class="center">${vis}</div></div>${FOOT}`;
  } else if (t === "liste") {
    el.innerHTML = `<div class="frame"></div><div class="pad"><h1 class="bas" style="font-size:${d ? 130 : 112}px">${esc(s.baslik)}</h1>
      <div class="items" style="${d ? "margin-top:80px" : ""}">${s.maddeler.map(([e, x]) => `<div><span>${e}</span>${esc(x)}</div>`).join("")}</div></div>${FOOT}`;
  } else if (t === "paket") {
    let vis;
    if (s.foto) vis = `<div class="pimg" style="background-image:url(${foto(s.foto)})"></div>`;
    else vis = `<div class="pimg" style="background-image:url(${await cardImg({urun: s.urun, tasarim: "bordo"}, 1000, 620)})"></div>`;
    el.innerHTML = `<div class="pad" style="gap:22px">${vis}<div class="ust">${esc(s.ad)}</div><div class="price">${esc(s.fiyat)}</div>
      <ul class="plist">${s.maddeler.map(m => `<li>${esc(m)}</li>`).join("")}</ul></div>${FOOT}`;
  } else if (t === "soru") {
    el.innerHTML = `<div class="frame"></div><div class="bignum">${s.no}</div><div class="pad" style="justify-content:center;gap:48px;position:relative"><div class="badge">${s.no}</div><h1 class="q">${esc(s.soru)}</h1><p class="a">${esc(s.cevap)}</p></div>${FOOT}`;
  } else if (t === "son") {
    el.classList.add("t-bordo");
    el.innerHTML = `<div class="frame"></div><div class="pad" style="justify-content:center;gap:40px;color:#fff">${LOGO}<h1 class="bas">${esc(s.baslik)}</h1>
      ${s.alt ? `<p class="alt">${esc(s.alt)}</p>` : ""}<div class="pill">memoryqr.bulqr.com.tr</div></div>`;
  } else if (t === "hikaye") {
    el.classList.add("t-bordo");
    let vis = "";
    if (s.ekran) vis = `<div class="center" style="height:${s.bos ? 760 : 1000}px;flex:none"><div class="phone"><img src="${ekran(s.ekran)}"></div></div>`;
    else if (s.urun) vis = `<div class="center" style="flex:none;height:880px"><img src="${await cardImg(s, 1000, 900)}" style="width:100%"></div>`;
    el.innerHTML = `<div class="pad" style="padding-top:220px;gap:40px"><div class="ust">MemoryQR</div><h1 class="bas" style="font-size:104px">${esc(s.baslik)}</h1>
      ${vis}${s.bos ? `<div class="box"></div>` : s.alt ? `<p class="alt">${esc(s.alt)}</p>` : ""}</div>${FOOT}`;
  } else if (t === "kamera") {
    el.classList.add("t-foto");
    el.innerHTML = `<div class="bg" style="background-image:url(${foto("pleksi-stand")});background-position:58% 50%;filter:saturate(1.05)"></div>
      <div class="scan"><i></i><i></i><i></i><i></i></div><div class="qrpill">🌐 memoryqr.bulqr.com.tr</div>
      ${s.baslik ? `<div class="pad" style="position:relative"><h1 class="bas" style="font-size:110px;text-shadow:0 4px 30px rgba(0,0,0,.6)">${esc(s.baslik)}</h1></div>` : ""}`;
  } else if (t === "mesaj") {
    el.classList.add("wa");
    el.innerHTML = `<div class="pad" style="padding-top:220px"><div class="ust" style="color:#8fd19e">Düğünden 1 hafta sonra…</div>
      <div class="chat">${s.mesajlar.map(m => `<div>${esc(m)}</div>`).join("")}</div></div>`;
  }
  document.getElementById("stage").append(el);
  await Promise.all([...el.querySelectorAll("img")].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  const bgs = [...el.querySelectorAll(".bg,.pimg")].map(b => (b.style.backgroundImage.match(/url\("?([^")]+)"?\)/) || [])[1]).filter(Boolean);
  await Promise.all(bgs.map(u => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = u; })));
  await document.fonts.ready;
  return el;
}
</script>
